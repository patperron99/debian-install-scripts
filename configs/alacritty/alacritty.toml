[env]
TERM = "xterm-256color"

[window]
opacity = 0.95
padding.x = 10
padding.y = 10
decorations = "Full"
decorations_theme_variant = "Dark"

[font]
size = 12.0

[font.bold]
family = "FiraCode Nerd Font"
style  = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style  = "Bold Italic"

[font.italic]
family = "FiraCode Nerd Font"
style  = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style  = "Regular"

[font.offset]
x = 0
y = 0

[keyboard]
bindings = [
    { key="Up",   mods="Control|Shift", action="ScrollLineUp" },
    { key="Down", mods="Control|Shift", action="ScrollLineDown" },
]

[general]
import = ["~/.config/alacritty/themes/current-theme.toml"]
