# AUTO-GENERATED — edit configs/tmux/theme.tmpl (format) or configs/themes/<slug>.sh (colors)

set -g status-style          "bg=#282828,fg=#ebdbb2"
set -g status-left-length    40
set -g status-right-length   60

# Left: [session] in accent box, filled arrow out
set -g status-left \
  "#[fg=#1d2021,bg=#d79921,bold] [#S] #[fg=#d79921,bg=#282828,nobold] "

# Right: date ❮ time ◀ [hostname]
set -g status-right \
  "#[fg=#928374,bg=#282828] %Y-%m-%d #[fg=#504945]#[fg=#ebdbb2,bg=#282828] %H:%M #[fg=#d79921,bg=#282828]#[fg=#1d2021,bg=#d79921,bold] [#h] "

# Window list: thin arrow between index and name, empty separator
# Active window: accent-colored box with filled arrows
setw -g window-status-style          "fg=#928374,bg=#282828"
setw -g window-status-format         " #[fg=#928374] #I#[fg=#504945]#[fg=#928374] #W#F "
setw -g window-status-current-format "#[fg=#1d2021,bg=#d79921,bold] #I#[fg=#1d2021,bg=#d79921]#[fg=#1d2021] #W#F #[fg=#d79921,bg=#282828,nobold] "
setw -g window-status-separator      ""

set -g pane-border-style        "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style            "fg=#1d2021,bg=#d79921,bold"
set -g message-command-style    "fg=#ebdbb2,bg=#504945"
