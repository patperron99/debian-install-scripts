# ── Keybindings ───────────────────────────────────────────────────────────────

# Applications
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+e exec $term -e yazi
bindsym $mod+b exec zen
bindsym $mod+shift+a exec kitty --app-id=pulsemixer -e pulsemixer
bindsym $mod+Shift+s exec chromium --app=https://app.slack.com/client --user-data-dir=$HOME/.config/chromium-slack --class=Slack

# Window management
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+v floating toggle
bindsym $mod+Shift+e exit

# Layout
bindsym $mod+j layout toggle split

# Focus
bindsym $mod+Left  focus left
bindsym $mod+Right focus right
bindsym $mod+Up    focus up
bindsym $mod+Down  focus down

# Move
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Down  move down

# Resize
bindsym $mod+minus       resize shrink width  50 px; resize shrink height 50 px
bindsym $mod+equal       resize grow   width  50 px; resize grow   height 50 px
bindsym $mod+Shift+equal resize grow   width  50 px; resize grow   height 50 px

# Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

# Scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+ctrl+minus  scratchpad show

# Lock / screensaver / utility menu
bindsym $mod+l         exec hyprlock
bindsym $mod+Shift+l   exec bash ~/.local/bin/screensaver-launch.sh
bindsym $mod+Escape    exec bash ~/.local/bin/utilitymenu.sh

# Clipboard history
bindsym $mod+c exec cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Reload config
bindsym $mod+Shift+c reload

# Screen recording
bindsym $mod+Shift+r exec pkill wf-recorder || wf-recorder -f ~/Videos/recording-$(date +%Y%m%d-%H%M%S).mp4

# Screenshot
bindsym $mod+p       exec grim -g "$(slurp)" - | wl-copy
bindsym $mod+Shift+p exec grim - | wl-copy
bindsym $mod+ctrl+p  exec grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

# Wallpaper cycle
bindsym $mod+w exec bash ~/.local/bin/wallpaper-next.sh

# Theme picker
bindsym $mod+Shift+t exec bash ~/.local/bin/theme-picker.sh

# Media keys
bindsym XF86AudioRaiseVolume exec pamixer -i 5
bindsym XF86AudioLowerVolume exec pamixer -d 5
bindsym XF86AudioMute        exec pamixer -t
bindsym XF86AudioPlay        exec playerctl play-pause
bindsym XF86AudioNext        exec playerctl next
bindsym XF86AudioPrev        exec playerctl previous

# Brightness keys
bindsym XF86MonBrightnessUp   exec brightnessctl set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Mouse drag
floating_modifier $mod normal
