# Look and Feel Configuration
# https://wiki.hyprland.org/Configuring/Variables/

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c4a7e7ee) rgba(ebbcbaee) 45deg
    col.inactive_border = rgba(403d52aa)

    layout = dwindle

    allow_tearing = false
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1,  5,   easeOutQuint
    animation = windows,       1,  4,   easeOutQuint
    animation = windowsIn,     1,  4,   easeOutQuint, popin 87%
    animation = windowsOut,    1,  2,   linear,       popin 87%
    animation = fadeIn,        1,  2,   almostLinear
    animation = fadeOut,       1,  2,   almostLinear
    animation = fade,          1,  3,   quick
    animation = layers,        1,  4,   easeOutQuint
    animation = layersIn,      1,  4,   easeOutQuint, fade
    animation = layersOut,     1,  2,   linear,       fade
    animation = workspaces,    1,  2,   almostLinear, fade
    animation = workspacesIn,  1,  2,   almostLinear, fade
    animation = workspacesOut, 1,  2,   almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
