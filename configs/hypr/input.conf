# Input Configuration
# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us
    # kb_variant =
    # kb_model =
    # kb_options =
    # kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        middle_button_emulation = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification
}

# 3-finger horizontal swipe → switch workspace (Hyprland 0.41+ syntax)
gesture = 3, horizontal, workspace
