# hypridle configuration
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock      # Avoid duplicate lock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Re-enable display after wake
}

listener {
    timeout = 300                              # 5 min: dim screen to 10%
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r              # Restore brightness on activity
}

listener {
    timeout = 600                              # 10 min: lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                              # 15 min: turn off display
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                             # 30 min: suspend
    on-timeout = systemctl suspend
}
