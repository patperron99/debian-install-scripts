# Autostart Configuration
# Applications to launch at startup

# Wallpaper (set by setup-wallpaper.sh — run it to pick a wallpaper)
exec-once = swaybg -i /home/sysadmin/Pictures/Wallpapers/northern-lights.jpg -m fill

# Status bar
exec-once = waybar

# Notification daemon
exec-once = mako

# Polkit agent (Hyprland native)
exec-once = hyprpolkitagent

# Multi-monitor management
exec-once = kanshi

# Clipboard history daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle management
exec-once = hypridle

# SwayOSD (volume/brightness OSD)
exec-once = swayosd-server
